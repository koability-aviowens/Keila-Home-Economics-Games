<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHE Health Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#5b6785;--pri:#2563eb;--sel:#dbe7ff;--ok:#16a34a;--bad:#dc2626;--bd:#cfd8ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--card:#1a2540;--ink:#f1f5ff;--mut:#a7b3d1;--pri:#5b8cff;--sel:#2a3d6e;--bd:#33446f}}
:root[data-theme="dark"]{--bg:#0f1729;--card:#1a2540;--ink:#f1f5ff;--mut:#a7b3d1;--pri:#5b8cff;--sel:#2a3d6e;--bd:#33446f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--mut);font-size:18px;line-height:1.4}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:16px;font-size:20px;border:0;border-radius:14px;background:var(--pri);color:#fff;margin-top:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}
.timer{width:64px;height:64px;position:relative;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.q{font-size:22px;line-height:1.35;margin:8px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin-bottom:10px;font-size:19px;border:3px solid var(--bd);border-radius:14px;background:var(--card);color:var(--ink)}
.opt b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bd)}
.opt.sel{border-color:var(--pri);background:var(--sel)}
.opt.sel b{background:var(--pri);color:#fff}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.big{font-size:64px;text-align:center;margin:12px 0}
.center{text-align:center}
.rev{margin-top:16px;font-size:17px}
.rev div{padding:10px;border-radius:10px;margin-bottom:8px;background:var(--bg)}
.hide{display:none}
</style></head><body><div class="wrap">

<div id="start" class="card center">
<h1>🏃 PHE Health Quiz</h1>
<p>44 questions • 30 seconds each.<br>Pick an answer, then tap <b>Next</b>. Your score shows at the end.</p>
<button class="btn" onclick="begin()">Start Quiz</button>
</div>

<div id="quiz" class="card hide">
<div class="top"><div id="count"></div><div class="timer"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--bd)" stroke-width="6"/><circle id="ring" cx="32" cy="32" r="28" fill="none" stroke="var(--pri)" stroke-width="6" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="0"/></svg><span id="t">30</span></div></div>
<div class="bar"><i id="prog"></i></div>
<div class="q" id="q"></div>
<div id="opts"></div>
<button class="btn" id="next" onclick="next()" disabled>Next</button>
</div>

<div id="end" class="card hide center">
<h1>Quiz Complete!</h1>
<div class="big" id="score"></div>
<p id="pct"></p>
<p id="msg"></p>
<button class="btn" onclick="toggleRev()">Review Answers</button>
<div id="rev" class="rev hide" style="text-align:left"></div>
<button class="btn" onclick="begin()">Play Again</button>
</div>

</div>
<script>
const Q=`Puberty is the stage when a child's body begins to develop into:|A baby's body|An adult body capable of reproduction|An older person's body|A stronger bone only|1
Puberty usually starts in girls between the ages of:|3-5|5-7|8-13|20-25|2
Puberty usually starts in boys between the ages of:|9-14|2-4|15-20|30-35|0
During puberty the body produces:|Only water|Sex hormones|Only sugar|Antibiotics|1
Adolescence is the period that begins with puberty and ends when a person:|Is born|Starts school|Becomes a mature adult|Gets sick|2
Another name for menstruation is:|Period or menses|Ovulation|Growth spurt|Acne|0
Menstruation is the monthly flow of blood from the uterus through the:|Mouth|Vagina|Nose|Stomach|1
Menstruation shows that the reproductive system is:|Damaged|Sleeping|Working normally|Not needed|2
Menstruation is a normal and ___ process.|Dangerous|Healthy|Shameful|Rare|1
The release of an egg during the menstrual cycle is called:|Ovulation|Perspiration|Digestion|Vaccination|0
A menstrual period usually lasts an average of:|2-5 days|2-5 weeks|2-5 months|1 hour|0
Which change happens in BOTH boys and girls during puberty?|Beard growth|Growth spurt in height and weight|Start of periods|Growth of testes|1
Which skin change is common during puberty?|Skin becomes oilier and pimples may appear|Skin turns blue|Skin falls off|Skin stops growing|0
Mood swings during puberty are examples of:|Physical changes only|Emotional changes|Hair changes|Voice changes|1
Which change is specific to GIRLS?|Deepening of voice|Development of breasts|Growth of beard|Wet dreams|1
Widening of the hips is a change in:|Boys|Girls|Neither|Babies|1
The start of menstruation is a sign of puberty in:|Boys|Girls|Teachers only|Babies|1
Which change is specific to BOYS?|Growth of facial hair (beard and moustache)|Start of periods|Development of breasts|Widening of hips|0
Broadening of the shoulders and muscle development happen in:|Girls only|Boys|Babies|Nobody|1
Wet dreams (nocturnal emissions) may happen to:|Boys|Girls only|Babies|Adults only|0
Personal hygiene means:|Keeping the body clean and healthy|Eating more sweets|Sleeping all day|Avoiding water|0
Good personal hygiene is important during puberty because the body produces more:|Bones|Sweat and oil|Blood only|Water only|1
How often should you wash your face gently to reduce pimples?|Once a month|Twice a day|Never|Once a year|1
Which is a good personal hygiene habit?|Bathe or shower daily|Wear dirty clothes|Never brush teeth|Share towels|0
How often should you brush your teeth at least?|Once a week|Twice a day|Once a month|Never|1
Menstrual hygiene means:|Ignoring the body during periods|Taking proper care of the body during menstruation|Staying away from water|Wearing dirty pads|1
Sanitary pads should be changed about every:|4-6 hours|2 days|1 week|1 month|0
During menstruation, the private parts should be washed gently from:|Back to front|Front to back|Side to side|Not washed at all|1
Hands should be washed with soap:|Only once a day|Before and after changing sanitary products|Never|Only at school|1
Used sanitary pads should be:|Flushed down the toilet|Wrapped and put in a bin|Thrown in the river|Left on the floor|1
Which underwear is best during menstruation?|Dirty and tight|Clean and breathable|Wet|None|1
STDs are diseases that spread mainly through:|Handshakes|Sexual contact with an infected person|Sharing pencils|Eating rice|1
Syphilis is a:|Viral STD|Bacterial STD|Skin cream|Vitamin|1
HIV stands for:|Human Immunodeficiency Virus|Healthy Immune Vitamin|Human Infection Vaccine|Hot Illness Virus|0
HIV weakens the body's:|Bones|Immune system|Hair|Eyes|1
AIDS stands for:|Acquired Immune Deficiency Syndrome|Active Illness Detection System|Acquired Infection Drug Support|Any Immune Disease Sign|0
Genital herpes is a viral STD that causes:|Painful blisters and sores around the genital area|Sore knees|Tooth decay|Hair loss|0
A symptom of gonorrhea is:|Pain or burning sensation when urinating|Long hair|Strong teeth|Loud voice|0
Gonorrhea can be treated with:|Antibiotics prescribed by a qualified health worker|Cold water only|Sleeping pills|Nothing at all|0
Which is a way to prevent STDs?|Abstinence|Sharing towels|Self-medication|Ignoring symptoms|0
HIV/AIDS has no cure but can be managed with:|Antiretroviral therapy (ART)|Cough syrup|Pain killers|Herbal tea only|0
Self medication means:|Treating yourself with drugs without a health worker's advice|Visiting a doctor|Taking medicine prescribed by a nurse|Exercising daily|0
A danger of self medication is:|Taking the wrong drug or dose|Becoming taller|Having more friends|Learning faster|0
If you think you have an STD, you should:|Tell an adult or health worker and seek proper advice|Hide it|Take any drug you find|Do nothing|0`.split("\n").map(l=>{const p=l.split("|");return{q:p[0],o:p.slice(1,5),a:+p[5]}});
const L="ABCD",T=30;
let i=0,sel=null,left=T,iv=null,ans=[];
const $=id=>document.getElementById(id);
function show(id){["start","quiz","end"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function begin(){i=0;ans=[];$("rev").classList.add("hide");show("quiz");load()}
function load(){
 sel=null;left=T;const x=Q[i];
 $("count").textContent="Question "+(i+1)+" of "+Q.length;
 $("prog").style.width=(i/Q.length*100)+"%";
 $("q").textContent=x.q;
 $("opts").innerHTML="";
 x.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+L[k]+"</b><span></span>";b.lastChild.textContent=t;b.onclick=()=>pick(k);$("opts").appendChild(b)});
 $("next").textContent=i==Q.length-1?"Submit":"Next";
 $("next").disabled=true;
 tick();clearInterval(iv);iv=setInterval(()=>{left--;tick();if(left<=0)next()},1000);
}
function tick(){$("t").textContent=left;$("ring").style.strokeDashoffset=176*(1-left/T);$("ring").style.stroke=left<=10?"var(--bad)":"var(--pri)"}
function pick(k){sel=k;[...$("opts").children].forEach((b,j)=>b.classList.toggle("sel",j==k));$("next").disabled=false}
function next(){
 clearInterval(iv);ans[i]=sel;
 if(i<Q.length-1){i++;load()}else finish();
}
function finish(){
 const s=ans.reduce((n,a,k)=>n+(a===Q[k].a?1:0),0),p=Math.round(s/Q.length*100);
 $("score").textContent=s+" / "+Q.length;
 $("pct").textContent=p+"%";
 $("msg").textContent=p>=80?"🌟 Excellent work!":p>=60?"👍 Good job! Keep practising.":p>=40?"🙂 Fair attempt. Revise and try again.":"📚 Keep studying, you can do better!";
 $("rev").innerHTML="";
 Q.forEach((x,k)=>{const d=document.createElement("div"),ok=ans[k]===x.a;
  d.textContent=(ok?"✅ ":"❌ ")+(k+1)+". "+x.q+" — Answer: "+x.o[x.a]+(ok?"":(ans[k]==null?" (no answer)":" (you chose: "+x.o[ans[k]]+")"));
  $("rev").appendChild(d)});
 show("end");
}
function toggleRev(){$("rev").classList.toggle("hide")}
</script></body></html>
